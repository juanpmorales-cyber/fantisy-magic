<!doctype html>
<html lang="en">

<title>Fantasy Magic</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">

</div>
<div id="help">WASD / Arrow Keys: Move &nbsp; • &nbsp; Mouse: Aim &nbsp; • &nbsp; Click: Fireball &nbsp; • &nbsp; Shift: Sprint</div>
